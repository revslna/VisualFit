<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VisualFit 3D – Virtual Fitting</title>
<style>
:root{--bg:#f4f2f7;--card:#fff;--tx:#1d1a2b;--mu:#6d6882;--ln:#e3dfee;--ac:#5b3fb3;--ac2:#3f6fd0;--stage:#e9e4f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131d;--card:#201d2c;--tx:#f0edf8;--mu:#a29cb8;--ln:#352f47;--ac:#9a82ee;--ac2:#6f9cf0;--stage:#2a2540}}
:root[data-theme="dark"]{--bg:#15131d;--card:#201d2c;--tx:#f0edf8;--mu:#a29cb8;--ln:#352f47;--ac:#9a82ee;--ac2:#6f9cf0;--stage:#2a2540}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Roboto Condensed","Segoe UI",system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:20px}
.b3{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border-radius:7px;padding:2px 8px;font-size:13px;font-weight:700}
header span.s{margin-left:auto;color:var(--mu);font-size:13px}
main{flex:1;overflow-y:auto;padding:14px 14px 18px;-webkit-overflow-scrolling:touch}
section{display:none;max-width:560px;margin:0 auto}
section.on{display:block}
h1{font-size:22px;margin:4px 0 2px}
p.sub{margin:0 0 14px;color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card label{display:block;font-size:15px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--ln)}
.row:focus-within{border-color:var(--ac)}
.row input,.row select{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;font-size:17px;padding:6px 0;outline:0}
.row select option{color:#000}
.row u{text-decoration:none;color:var(--mu);font-size:13px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ac2),var(--ac));cursor:pointer}
.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.note{text-align:center;color:var(--mu);font-size:13px;margin-top:8px}
#stage{position:relative;height:min(58vh,520px);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--stage),var(--bg));border:1px solid var(--ln)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.tag{position:absolute;left:10px;top:10px;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:4px 10px;font-size:13px}
.ctl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:8px 10px;margin-top:10px}
.ctl button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 11px;font:inherit;font-size:14px;cursor:pointer}
.ctl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ctl input{flex:1;min-width:60px;accent-color:var(--ac)}
.sw{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sw i{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ln);cursor:pointer}
.sw i.on{box-shadow:0 0 0 2.5px var(--ac)}
.sw span{color:var(--mu);font-size:14px;margin-right:2px}
.rec{background:#0f7b4f;color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rec b{font-size:30px;display:block;line-height:1}
.rec em{font-style:normal;font-size:14px;opacity:.9}
.rec .m{text-align:right}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chips button{flex:1;padding:10px 0;border-radius:10px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.chips button.on{border-color:var(--ac);color:var(--ac)}
.hm{display:flex;gap:14px;align-items:center}
.hm svg{width:42%;max-width:170px;flex:none}
.lg div{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.st{display:flex;justify-content:space-between;font-size:15px;padding:5px 0;border-bottom:1px dashed var(--ln)}
.st b{font-weight:700}
nav{display:flex;background:var(--card);border-top:1px solid var(--ln)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:9px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="logo">VisualFit</div><div class="b3">3D</div><span class="s" id="who">Profil belum disimpan</span></header>
<main>
<section id="t0" class="on">
<h1>Data Profil Tubuh Anda</h1>
<p class="sub">Lengkapi parameter berikut untuk simulasi fitting yang presisi.</p>
<div id="form"></div>
<button class="btn" id="save">Simpan Profil</button>
<div class="note">Data Anda aman dan terlindungi.</div>
</section>
<section id="t1">
<div id="stage"><div class="tag" id="tag"></div></div>
<div class="ctl">
<button id="bRot" class="on">360° Putar</button>
<button id="bOrb">Orbit</button>
<input type="range" id="zoom" min="0.9" max="2.6" step="0.01" value="1.7" aria-label="Zoom">
</div>
<div class="sw" id="sw"><span>Warna</span></div>
</section>
<section id="t2">
<div class="rec"><div><b id="rs">Size M</b><em>Direkomendasikan</em></div><div class="m"><b id="rp">95%</b><em>Kecocokan</em></div></div>
<div class="chips" id="chips"></div>
<div class="card">
<div class="hm">
<svg viewBox="0 0 100 130" aria-label="Peta kecocokan">
<g fill="var(--ln)"><circle cx="50" cy="13" r="9"/><rect x="45" y="20" width="10" height="8"/>
<path d="M28 32Q50 25 72 32L68 62Q62 74 68 90L76 124H24L32 90Q38 74 32 62Z"/>
<rect x="15" y="33" width="12" height="46" rx="6" transform="rotate(6 21 33)"/><rect x="73" y="33" width="12" height="46" rx="6" transform="rotate(-6 79 33)"/></g>
<g opacity=".85"><ellipse id="z_bahu" cx="50" cy="32" rx="24" ry="5"/><ellipse id="z_dada" cx="50" cy="48" rx="15" ry="9"/>
<ellipse id="z_pinggang" cx="50" cy="68" rx="12" ry="5"/><ellipse id="z_pinggul" cx="50" cy="88" rx="19" ry="8"/>
<rect id="z_lengan" x="15" y="36" width="12" height="26" rx="6" transform="rotate(6 21 33)"/><rect id="z_lengan2" x="73" y="36" width="12" height="26" rx="6" transform="rotate(-6 79 33)"/></g>
</svg>
<div class="lg"><div><i style="background:#0f7b4f"></i>Pas</div><div><i style="background:#6cc57a"></i>Nyaman</div><div><i style="background:#f0b429"></i>Sempit</div><div><i style="background:#e5484d"></i>Longgar</div></div>
</div>
</div>
<div class="card" id="stats"></div>
<div class="card" id="notes"></div>
<button class="btn" id="bag">Masukkan ke Tas</button>
<div style="height:8px"></div>
<button class="btn o" id="vari">Lihat di Avatar</button>
</section>
</main>
<nav>
<button class="on" data-t="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>Profil</button>
<button data-t="1"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>Fitting 3D</button>
<button data-t="2"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analisis</button>
</nav>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var $=function(s){return document.querySelector(s)};
var FD=[['tinggi','Tinggi Badan','cm',162],['berat','Berat Badan','kg',56],['bentuk','Bentuk Tubuh'],['lengan','Panjang Lengan','cm',55],['lgl','Lingkar Lengan','cm',26],['dada','Lingkar Dada','cm',88],['pinggang','Lingkar Pinggang','cm',70],['pinggul','Lingkar Pinggul','cm',94],['bahu','Lebar Bahu','cm',38]];
var BT=['Jam Pasir','Pir','Apel','Persegi Panjang','Segitiga Terbalik'];
var P={},cur='M',colorI=0;
var COL=[['Mauve','#b9707a'],['Navy','#26355d'],['Sage','#7f9c86'],['Krem','#e8dcc8']];
var SZ={S:{dada:86,pinggang:68,pinggul:92,bahu:37,lgl:26},M:{dada:90,pinggang:72,pinggul:96,bahu:38.5,lgl:28},L:{dada:96,pinggang:78,pinggul:102,bahu:40,lgl:30},XL:{dada:102,pinggang:84,pinggul:108,bahu:41.5,lgl:32}};
var ZN={dada:['Dada',[1,9,13],5,1.2],pinggang:['Pinggang',[1,9,13],5,1.2],pinggul:['Pinggul',[1,9,13],5,1.2],bahu:['Bahu',[0,2,3.5],1,3],lgl:['Lengan',[.5,4,6],2.5,2]};
var CC={tight:'#f0b429',perfect:'#0f7b4f',good:'#6cc57a',loose:'#e5484d'};
var CN={tight:'Sempit',perfect:'Pas',good:'Nyaman',loose:'Longgar'};

// form
var fh='';
FD.forEach(function(f,i){
 fh+='<div class="card"><label for="f_'+f[0]+'">'+(i+1)+'. '+f[1]+(f[2]?' ('+f[2]+')':' (pilih)')+'</label><div class="row">';
 if(!f[2]){fh+='<select id="f_'+f[0]+'">'+BT.map(function(b){return '<option>'+b+'</option>'}).join('')+'</select>'}
 else fh+='<input id="f_'+f[0]+'" type="number" inputmode="decimal" value="'+f[3]+'"><u>'+f[2]+'</u>';
 fh+='</div></div>';
});
$('#form').innerHTML=fh;
function readP(){
 FD.forEach(function(f){var e=$('#f_'+f[0]);
  if(!f[2])P[f[0]]=e.value;
  else{var v=parseFloat(e.value);P[f[0]]=isFinite(v)&&v>0?v:f[3]}});
 P.tinggi=Math.min(200,Math.max(140,P.tinggi));
 P.dada=Math.min(130,Math.max(70,P.dada));P.pinggang=Math.min(120,Math.max(54,P.pinggang));
 P.pinggul=Math.min(140,Math.max(76,P.pinggul));P.bahu=Math.min(48,Math.max(32,P.bahu));
 P.lengan=Math.min(70,Math.max(45,P.lengan));P.lgl=Math.min(40,Math.max(20,P.lgl));
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}

// fit
function fit(sz){
 var r={},sc=0,n=0;
 Object.keys(ZN).forEach(function(k){
  var e=SZ[sz][k]-P[k],z=ZN[k],t=z[1],c=e<t[0]?'tight':e<t[1]?'perfect':e<t[2]?'good':'loose';
  r[k]={e:e,c:c};sc+=Math.abs(e-z[2])*z[3];n++});
 r.score=Math.round(Math.max(45,Math.min(99,100-sc/n*1.6)));return r}
function best(){var b='S',s=0;['S','M','L','XL'].forEach(function(z){var f=fit(z).score;if(f>s){s=f;b=z}});return b}
function renderA(){
 var f=fit(cur),b=best();
 $('#rs').textContent='Size '+cur;$('#rp').textContent=f.score+'%';
 $('.rec em').textContent=cur===b?'Direkomendasikan':'Ukuran pilihan Anda';
 $('#chips').innerHTML=['S','M','L','XL'].map(function(z){return '<button data-z="'+z+'" class="'+(z===cur?'on':'')+'">'+z+(z===b?' ★':'')+'</button>'}).join('');
 var m={bahu:['z_bahu'],dada:['z_dada'],pinggang:['z_pinggang'],pinggul:['z_pinggul'],lgl:['z_lengan','z_lengan2']};
 Object.keys(m).forEach(function(k){m[k].forEach(function(id){$('#'+id).setAttribute('fill',CC[f[k].c])})});
 $('#stats').innerHTML=Object.keys(ZN).map(function(k){var e=f[k].e;return '<div class="st"><span>'+ZN[k][0]+' (tubuh '+P[k]+' cm)</span><b style="color:'+CC[f[k].c]+'">'+CN[f[k].c]+' ('+(e>0?'+':'')+e.toFixed(1)+')</b></div>'}).join('');
 var tight=Object.keys(ZN).filter(function(k){return f[k].c==='tight'}).map(function(k){return ZN[k][0]});
 var loose=Object.keys(ZN).filter(function(k){return f[k].c==='loose'}).map(function(k){return ZN[k][0]});
 var s='Bentuk tubuh '+P.bentuk+'. ';
 s+=tight.length?'Terasa sempit di '+tight.join(', ')+'; coba ukuran lebih besar. ':'';
 s+=loose.length?'Terlalu longgar di '+loose.join(', ')+'; coba ukuran lebih kecil. ':'';
 if(!tight.length&&!loose.length)s+='Potongan jatuh nyaman dan rapi di seluruh badan.';
 $('#notes').textContent=s;
}
$('#chips').onclick=function(e){var z=e.target.getAttribute('data-z');if(z){cur=z;renderA();build()}};

// 3D
var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.1,50),ren,grp=new THREE.Group(),spin=true,orbit=false,elev=.1,zoomV=1.7,ready=false;
scene.add(grp);
scene.add(new THREE.HemisphereLight(0xffffff,0x9a90b8,.85));
var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(1.5,2.5,2.5);scene.add(dl);
var dl2=new THREE.DirectionalLight(0xffd9e6,.35);dl2.position.set(-2,1,-2);scene.add(dl2);
function R(c){return c/6.2832*.01}
function lathe(p,seg){var c=new THREE.SplineCurve(p.map(function(a){return new THREE.Vector2(a[0],a[1])}));return new THREE.LatheGeometry(c.getPoints(seg||48),44)}
function M(g,m,x,y,z){var o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
function build(){
 if(!ren)return;
 while(grp.children.length)grp.remove(grp.children[0]);
 var H=P.tinggi/100,y=function(f){return f*H};
 var skin=new THREE.MeshStandardMaterial({color:0xe6bfa0,roughness:.65});
 var hairM=new THREE.MeshStandardMaterial({color:0x3a2217,roughness:.5});
 var Z=SZ[cur],g={};
 ['dada','pinggang','pinggul','lgl'].forEach(function(k){g[k]=Math.max(Z[k],P[k]+(k==='lgl'?2:1.6))});
 var sh=P.bahu/2*.01/1.18;
 // torso
 var t=M(lathe([[R(P.pinggul)*.86,y(.46)],[R(P.pinggul),y(.52)],[R(P.pinggang),y(.625)],[R(P.dada),y(.715)],[R(P.dada)*.92,y(.77)],[sh,y(.815)],[.052,y(.84)],[.001,y(.845)]]),skin);
 t.scale.set(1.18,1,.82);grp.add(t);
 grp.add(M(new THREE.CylinderGeometry(.042,.048,y(.075),20),skin,0,y(.875),0));
 // head
 var hr=H*.057,hy=H-hr*1.15;
 var hd=M(new THREE.SphereGeometry(hr,32,24),skin,0,hy,0);hd.scale.set(.92,1.12,1);grp.add(hd);
 grp.add(M(new THREE.SphereGeometry(hr*.14,12,10),skin,0,hy-hr*.1,hr*1.0));
 var cap=M(new THREE.SphereGeometry(hr*1.06,32,20,0,6.2832,0,1.9),hairM,0,hy+hr*.04,-hr*.06);cap.scale.set(.95,1.12,1.02);grp.add(cap);
 var bk=M(new THREE.SphereGeometry(hr*.95,24,16),hairM,0,hy-hr*.95,-hr*.42);bk.scale.set(.95,1.45,.7);grp.add(bk);
 // legs
 [-1,1].forEach(function(s){
  grp.add(M(new THREE.CylinderGeometry(R(P.pinggul)*.52,.027,y(.49),18),skin,s*R(P.pinggul)*.52,y(.245),0));
  var ft=M(new THREE.SphereGeometry(.035,14,10),skin,s*R(P.pinggul)*.52,.014,.03);ft.scale.set(.9,.45,1.9);grp.add(ft);
 });
 // garment
 var gm=new THREE.MeshStandardMaterial({color:COL[colorI][1],roughness:.85,side:THREE.DoubleSide});
 var ts=Math.max(sh,R(g.dada)*.92);var top=R(g.dada)*.92+(sh-R(g.dada)*.92)*.45+.004;
 var gr=M(lathe([[R(g.pinggul)*1.4,y(.3)],[R(g.pinggul)*1.14,y(.4)],[R(g.pinggul)+.004,y(.52)],[R(g.pinggang)+.004,y(.625)],[R(g.dada)+.005,y(.715)],[R(g.dada)*.93+.004,y(.77)],[top,y(.79)]]),gm);
 gr.scale.set(1.18,1,.82);grp.add(gr);
 var bl=M(new THREE.TorusGeometry(R(g.pinggang)+.009,.009,8,48),new THREE.MeshStandardMaterial({color:new THREE.Color(COL[colorI][1]).multiplyScalar(.6),roughness:.7}),0,y(.625),0);
 bl.scale.set(1.18,.82,1);bl.rotation.x=1.5708;grp.add(bl);
 // arms
 var L=P.lengan/100,ar=R(P.lgl);
 [-1,1].forEach(function(s){
  var pv=new THREE.Object3D();pv.position.set(s*P.bahu/2*.01,y(.805),0);pv.rotation.z=s*.12;
  pv.add(M(new THREE.SphereGeometry(ar*1.04,16,12),skin));
  pv.add(M(new THREE.CylinderGeometry(ar,ar*.62,L,16),skin,0,-L/2,0));
  pv.add(M(new THREE.SphereGeometry(ar*.58,12,10),skin,0,-L-.02,0));
  var sr=R(g.lgl)+.003;
  pv.add(M(new THREE.CylinderGeometry(sr*1.06,sr*.8,L*.58,18,1,true),gm,0,-L*.29,0));
  grp.add(pv);
 });
 // floor
 grp.add(M(new THREE.CylinderGeometry(.55,.55,.01,48),new THREE.MeshStandardMaterial({color:0xcfc6e4,roughness:.9}),0,-.005,0));
 setCam();
 $('#tag').textContent='Gaun '+COL[colorI][0]+' · Size '+cur;
}
function setCam(){var H=P.tinggi/100;cam.position.set(0,H*.52+elev*H,H*zoomV*1.7);cam.lookAt(0,H*.5,0)}
function size(){var s=$('#stage');if(!ren||!s.clientWidth)return;ren.setSize(s.clientWidth,s.clientHeight);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}
function initGL(){
 if(ren)return;
 try{ren=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){$('#stage').textContent='WebGL tidak tersedia di perangkat ini.';return}
 ren.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
 $('#stage').appendChild(ren.domElement);size();
 var d=false,lx=0,ly=0,c=ren.domElement;
 c.addEventListener('pointerdown',function(e){d=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointerup',function(){d=false});
 c.addEventListener('pointermove',function(e){if(!d)return;grp.rotation.y+=(e.clientX-lx)*.012;
  if(orbit){elev=Math.max(-.2,Math.min(.6,elev+(e.clientY-ly)*.003));setCam()}lx=e.clientX;ly=e.clientY});
 build();
 (function loop(){requestAnimationFrame(loop);if(spin&&$('#t1').classList.contains('on'))grp.rotation.y+=.009;ren.render(scene,cam)})();
}
window.addEventListener('resize',size);
$('#bRot').onclick=function(){spin=!spin;this.classList.toggle('on',spin)};
$('#bOrb').onclick=function(){orbit=!orbit;this.classList.toggle('on',orbit);if(!orbit){elev=.1;setCam()}};
$('#zoom').oninput=function(){zoomV=+this.value;setCam()};
$('#zoom').value=zoomV;
$('#sw').innerHTML+=COL.map(function(c,i){return '<i data-i="'+i+'" style="background:'+c[1]+'" class="'+(i===0?'on':'')+'" role="button" aria-label="'+c[0]+'"></i>'}).join('');
$('#sw').onclick=function(e){var i=e.target.getAttribute('data-i');if(i===null)return;colorI=+i;[].forEach.call(this.querySelectorAll('i'),function(n){n.classList.toggle('on',n.getAttribute('data-i')==i)});build()};

// nav
function go(n){
 [].forEach.call(document.querySelectorAll('section'),function(s,i){s.classList.toggle('on',i===n)});
 [].forEach.call(document.querySelectorAll('nav button'),function(b,i){b.classList.toggle('on',i===n)});
 if(n===1){initGL();setTimeout(size,30)}
 if(n===2)renderA();
 $('main').scrollTop=0;
}
[].forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){readP();cur=best();go(+b.getAttribute('data-t'));if(ren)build()}});
$('#save').onclick=function(){readP();cur=best();$('#who').textContent='Profil tersimpan';toast('Profil tersimpan. Size '+cur+' cocok untuk Anda.');if(ren)build();go(1)};
$('#bag').onclick=function(){toast('Gaun '+COL[colorI][0]+' size '+cur+' masuk ke tas')};
$('#vari').onclick=function(){go(1);if(ren)build()};
readP();cur=best();
</script>
</body>
</html>
